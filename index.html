<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dose of TMKOC | Taarak Mehta Ka Ooltah Chashmah</title>
    
    <!-- Meta Tags for SEO & Social -->
    <meta name="description" content="Your daily dose of TMKOC episodes across all seasons from Episode 1 to latest. The most important episodes of Gokuldham Society, with zero noise.">
    <meta property="og:title" content="Daily Dose of TMKOC">
    <meta property="og:description" content="The absolute top episodes across all seasons of Taarak Mehta Ka Ooltah Chashmah today.">
    <meta property="og:type" content="website">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">Daily<span>Dose</span> <small style="font-size: 10px; background: #6366f1; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 6px;">TMKOC</small></a>
            
            <section class="filters" aria-label="Category filters">
                <button class="chip active" data-category="all">All Episodes</button>
                <button class="chip" data-category="trending">Trending</button>
                <button class="chip" data-category="classic">Classic (1-500)</button>
                <button class="chip" data-category="golden">Golden (501-1500)</button>
                <button class="chip" data-category="modern">Modern (1501-3000)</button>
                <button class="chip" data-category="recent">Recent (3001+)</button>
            </section>

            <nav>
                <button id="theme-toggle" class="btn-icon" aria-label="Toggle Dark Mode">
                    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Search Bar Section with Search Button -->
        <section class="search-section" style="margin-top: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: center;">
            <form id="search-form" style="display: flex; gap: 10px; width: 100%; max-width: 650px;">
                <input type="text" id="search-input" placeholder="Search episode number (e.g. 450, 1500, 2159) or keywords (Jethalal, Bhide)..." style="flex: 1; padding: 12px 20px; border-radius: 9999px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; outline: none;">
                <button type="submit" id="search-submit-btn" class="chip active" style="padding: 12px 24px; cursor: pointer; border: none; font-weight: 700; border-radius: 9999px; font-size: 14px;">🔍 Search</button>
            </form>
        </section>

        <!-- Hero Section -->
        <section id="hero-container" aria-label="Featured episode" style="margin-bottom: var(--space-2xl);">
        </section>

        <!-- Dynamic Content Area (Grid) -->
        <section id="news-container" class="news-grid" aria-live="polite">
        </section>
        
        <!-- Inject perfect grid of skeletons instantly before main JS loads -->
        <script>
            function renderSkeletons() {
                var container = document.getElementById('news-container');
                if (!container || (container.innerHTML.trim() !== '' && !container.innerHTML.includes('skeleton-text'))) return;
                
                var width = window.innerWidth || document.documentElement.clientWidth || 1024;
                var height = window.innerHeight || document.documentElement.clientHeight || 768;
                
                var columns = width > 768 ? Math.max(1, Math.floor((width * 0.95) / 340)) : 1;
                var rows = Math.max(2, Math.ceil(height / 400));
                var total = columns * rows;
                
                var skeletonHTML = '<article class="card"><div class="card-img-wrap skeleton"></div><div class="card-content"><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div></div></article>';
                container.innerHTML = skeletonHTML.repeat(total);
            }
            renderSkeletons();
            window.addEventListener('resize', renderSkeletons);
            document.addEventListener('DOMContentLoaded', renderSkeletons);
        </script>

        <!-- Infinite Scroll Sentinel -->
        <section id="pagination" style="text-align: center; margin-top: 3rem; margin-bottom: 1rem; display: none;">
            <div style="opacity: 0.6; font-size: 0.9rem;">Loading more episodes...</div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> Daily Dose of TMKOC.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
